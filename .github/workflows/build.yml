name: Build and Upload

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - test
      - main
    types: [closed]

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
        name: ${{ github.ref_name }}
    steps:
      - name: Echo environment
        run: echo ${{ github.ref_name }}
      - name: Checkout
        uses: actions/checkout@v2
        
      - name: Npm install
        run: npm install
        
      - name: Build
        run: npm run build -- -- --mode ${{ github.ref_name }}
        
      - name: Upload build dir
        if: github.ref_name == 'test' || github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{github.ref_name}}
          path: dist
  deploy:
    needs: [build]
    if: github.event.pull_request.merged == true && (github.ref_name == 'test' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    environment:
        name: ${{ github.ref_name }}
    steps:
    - name: Download build dir
      uses: actions/download-artifact@v4
      with:
        name: build-artifact-${{github.ref_name}}
        path: dist
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region: ap-southeast-2

    - name: Sync to S3
      run: aws s3 sync dist s3://${{ secrets.S3_BUCKET }}

    - name: Invalidate cloudfront
      run: aws cloudfront create-invalidation --distribution-id ${{ secrets.DISTRIBUTION_ID }} --paths "/*"
